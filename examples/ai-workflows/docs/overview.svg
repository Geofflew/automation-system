<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="484" viewBox="0 0 1040 484" role="img" aria-labelledby="title desc"><title id="title">A “yes” must authorize exactly what was shown</title><desc id="desc">A person reviews three account changes and approves them. The model forwards that approval with a different list of ten accounts. Without the guard: Receive “yes” with the model’s list of ten. Trust the list supplied in the confirmation. Change ten accounts; seven were never approved. With the guard: Look up the three changes stored for this proposal. Compare the supplied list with the stored proposal. Reject the edited list; apply no changes.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#63758a"/></marker></defs><rect width="1040" height="484" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="44" font-size="25" fill="#14243a" font-weight="700">A “yes” must authorize exactly what was shown</text><text x="28" y="82" font-size="18" fill="#243247" font-weight="400">A person reviews three account changes and approves them.</text><text x="28" y="110" font-size="18" fill="#243247" font-weight="400">The model forwards that approval with a different list of ten accounts.</text><text x="28" y="163" font-size="12" fill="#a23d29" font-weight="700">WITHOUT THE GUARD</text><rect x="28" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="44" y="210" font-size="18" fill="#243247" font-weight="400">Receive “yes” with</text><text x="44" y="236" font-size="18" fill="#243247" font-weight="400">the model’s list of ten.</text><path d="M339 218H359" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="366" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="382" y="210" font-size="18" fill="#243247" font-weight="400">Trust the list supplied</text><text x="382" y="236" font-size="18" fill="#243247" font-weight="400">in the confirmation.</text><path d="M677 218H697" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="720" y="210" font-size="18" fill="#243247" font-weight="400">Change ten accounts;</text><text x="720" y="236" font-size="18" fill="#243247" font-weight="400">seven were never approved.</text><text x="28" y="305" font-size="12" fill="#12675b" font-weight="700">WITH THE GUARD</text><rect x="28" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="44" y="352" font-size="18" fill="#243247" font-weight="400">Look up the three changes</text><text x="44" y="378" font-size="18" fill="#243247" font-weight="400">stored for this proposal.</text><path d="M339 360H359" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="366" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="382" y="352" font-size="18" fill="#243247" font-weight="400">Compare the supplied list</text><text x="382" y="378" font-size="18" fill="#243247" font-weight="400">with the stored proposal.</text><path d="M677 360H697" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="720" y="352" font-size="18" fill="#243247" font-weight="400">Reject the edited list;</text><text x="720" y="378" font-size="18" fill="#243247" font-weight="400">apply no changes.</text><text x="28" y="458" font-size="16" fill="#52647c" font-weight="400">An unchanged confirmation applies the stored three. The server controls what “yes” means.</text></g></svg>
