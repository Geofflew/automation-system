<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1055" viewBox="0 0 1100 1055"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476679" stroke-width="1.5"/></marker></defs><rect width="1100" height="1055" rx="18" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#163447}.title{font-size:32px;font-weight:700}.subtitle{font-size:19px;fill:#506575}.lane{font-size:22px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.edge{font-size:16px;fill:#506575}</style><text x="36" y="49" class="title">Four ways to automate everyday work</text><text x="36" y="83" class="subtitle">Each row follows an input through model + application work to a useful result</text><rect x="20" y="112" width="1060" height="210" rx="12" fill="#f6f9f8"/><text x="40" y="143" class="lane">Answer product questions waiting in a shared channel</text><rect x="40" y="161" width="290" height="139" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="189" class="head">An unanswered question</text><text x="56" y="218" class="body">Claim a question with</text><text x="56" y="242" class="body">no existing reply.</text><path d="M334 225 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="161" width="290" height="139" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="189" class="head">Draft and check an answer</text><text x="421" y="218" class="body">Model drafts and judges;</text><text x="421" y="242" class="body">code checks file existence</text><text x="421" y="266" class="body">and limits posting.</text><path d="M699 225 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="161" width="290" height="139" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="189" class="head">A reply in the channel</text><text x="786" y="218" class="body">Post with its source; log</text><text x="786" y="242" class="body">posted, refused or deferred</text><text x="786" y="266" class="body">outcomes for inspection.</text><rect x="20" y="337" width="1060" height="210" rx="12" fill="#f3f6fa"/><text x="40" y="368" class="lane">Investigate an account using database tools</text><rect x="40" y="386" width="290" height="139" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="414" class="head">An account question</text><text x="56" y="443" class="body">Ask about deals, tickets</text><text x="56" y="467" class="body">or account details.</text><path d="M334 450 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="386" width="290" height="139" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="414" class="head">Gather evidence with tools</text><text x="421" y="443" class="body">Model requests lookups;</text><text x="421" y="467" class="body">code runs read-only tools</text><text x="421" y="491" class="body">and counts up to six calls.</text><path d="M699 450 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="386" width="290" height="139" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="414" class="head">Answer or clarification</text><text x="786" y="443" class="body">Use the gathered records;</text><text x="786" y="467" class="body">state when the tool budget</text><text x="786" y="491" class="body">ended the investigation.</text><rect x="20" y="562" width="1060" height="210" rx="12" fill="#f6f9f8"/><text x="40" y="593" class="lane">Change account owners with human approval</text><rect x="40" y="611" width="290" height="139" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="639" class="head">An owner-change request</text><text x="56" y="668" class="body">Model reads the requested</text><text x="56" y="692" class="body">owners and region.</text><path d="M334 675 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="611" width="290" height="139" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="639" class="head">Prepare a stored proposal</text><text x="421" y="668" class="body">Query matching accounts;</text><text x="421" y="692" class="body">store and show exact changes</text><text x="421" y="716" class="body">for the person to confirm.</text><path d="M699 675 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="611" width="290" height="139" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="639" class="head">Checked account updates</text><text x="786" y="668" class="body">Validate the confirmation;</text><text x="786" y="692" class="body">apply stored changes and</text><text x="786" y="716" class="body">report changed-row refusals.</text><rect x="20" y="787" width="1060" height="210" rx="12" fill="#f3f6fa"/><text x="40" y="818" class="lane">Prepare support notes from similar past tickets</text><rect x="40" y="836" width="290" height="139" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="864" class="head">A new support event</text><text x="56" y="893" class="body">Store the ticket event</text><text x="56" y="917" class="body">for a worker to pick up.</text><path d="M334 900 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="836" width="290" height="139" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="864" class="head">Find and use past tickets</text><text x="421" y="893" class="body">Retrieve similar cases;</text><text x="421" y="917" class="body">model picks a case and</text><text x="421" y="941" class="body">question; code builds note.</text><path d="M699 900 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="836" width="290" height="139" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="864" class="head">An internal staff note</text><text x="786" y="893" class="body">Add a possible cause,</text><text x="786" y="917" class="body">a check and one question;</text><text x="786" y="941" class="body">record the action once.</text></svg>