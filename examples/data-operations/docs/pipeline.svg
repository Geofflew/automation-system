<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476679" stroke-width="1.5"/></marker></defs><rect width="1100" height="1180" rx="18" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#163447}.title{font-size:32px;font-weight:700}.subtitle{font-size:19px;fill:#506575}.lane{font-size:22px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.edge{font-size:16px;fill:#506575}</style><text x="36" y="49" class="title">Keep the warehouse working as it changes</text><text x="36" y="83" class="subtitle">Independent maintenance examples · each row follows its own path</text><rect x="20" y="112" width="1060" height="190" rx="12" fill="#f6f9f8"/><text x="40" y="143" class="lane">Keep work moving · migrations</text><rect x="40" y="161" width="290" height="117" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="189" class="head">Attempt the migration</text><text x="56" y="218" class="body">Start a transaction with</text><text x="56" y="242" class="body">a short lock-wait limit.</text><path d="M334 225 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="161" width="290" height="117" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="189" class="head">Run with bounded waits</text><text x="421" y="218" class="body">On lock timeout: roll back,</text><text x="421" y="242" class="body">pause, then retry.</text><path d="M699 225 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="161" width="290" height="117" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="189" class="head">Finish or fail clearly</text><text x="786" y="218" class="body">Commit if successful;</text><text x="786" y="242" class="body">stop after final failure.</text><rect x="20" y="317" width="1060" height="190" rx="12" fill="#f3f6fa"/><text x="40" y="348" class="lane">Keep work moving · incoming events</text><rect x="40" y="366" width="290" height="117" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="394" class="head">Receive an event</text><text x="56" y="423" class="body">Verify it, store its ID</text><text x="56" y="447" class="body">and body, acknowledge.</text><path d="M334 430 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="366" width="290" height="117" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="394" class="head">Wake the worker</text><text x="421" y="423" class="body">NOTIFY triggers work;</text><text x="421" y="447" class="body">stored backlog can also</text><text x="421" y="471" class="body">be drained separately.</text><path d="M699 430 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="366" width="290" height="117" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="394" class="head">Process stored events</text><text x="786" y="423" class="body">Claim each event, apply</text><text x="786" y="447" class="body">the effect, mark handled.</text><rect x="20" y="522" width="1060" height="190" rx="12" fill="#f6f9f8"/><text x="40" y="553" class="lane">Keep work moving · scheduled jobs</text><rect x="40" y="571" width="290" height="117" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="599" class="head">A scheduled tick</text><text x="56" y="628" class="body">Read each job’s schedule</text><text x="56" y="652" class="body">and disabled-job settings.</text><path d="M334 635 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="571" width="290" height="117" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="599" class="head">Select due, enabled jobs</text><text x="421" y="628" class="body">Separate sync and cleanup;</text><text x="421" y="652" class="body">missing settings stop work.</text><path d="M699 635 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="571" width="290" height="117" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="599" class="head">Run and record results</text><text x="786" y="628" class="body">Track each job separately</text><text x="786" y="652" class="body">and report missing runs.</text><rect x="20" y="727" width="1060" height="190" rx="12" fill="#f3f6fa"/><text x="40" y="758" class="lane">Check what is deployed · definitions, defaults and placeholders</text><rect x="40" y="776" width="290" height="117" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="804" class="head">Inspect expected + live</text><text x="56" y="833" class="body">Build a scratch schema;</text><text x="56" y="857" class="body">inspect live dependencies.</text><path d="M334 840 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="776" width="290" height="117" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="804" class="head">Compare actual objects</text><text x="421" y="833" class="body">Find definition/default gaps</text><text x="421" y="857" class="body">and outdated NULL stubs.</text><path d="M699 840 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="776" width="290" height="117" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="804" class="head">Report specific findings</text><text x="786" y="833" class="body">Name the object or column</text><text x="786" y="857" class="body">and the evidence to inspect.</text><rect x="20" y="932" width="1060" height="190" rx="12" fill="#f6f9f8"/><text x="40" y="963" class="lane">Explain discrepancies · financial reconciliation</text><rect x="40" y="981" width="290" height="117" rx="8" fill="#ffffff" stroke="#b8cbd1"/><text x="56" y="1009" class="head">Ledger + workbook</text><text x="56" y="1038" class="body">The totals differ because</text><text x="56" y="1062" class="body">their rules can differ.</text><path d="M334 1045 H396" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="405" y="981" width="290" height="117" rx="8" fill="#e6eff8" stroke="#8aa8c3"/><text x="421" y="1009" class="head">Apply named rules</text><text x="421" y="1038" class="body">Compare totals, then</text><text x="421" y="1062" class="body">compare deal by deal.</text><path d="M699 1045 H761" stroke="#476679" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="981" width="290" height="117" rx="8" fill="#e6f2ec" stroke="#b8cbd1"/><text x="786" y="1009" class="head">Explain what remains</text><text x="786" y="1038" class="body">Trace differing rows</text><text x="786" y="1062" class="body">to causes in source records.</text></svg>