<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="484" viewBox="0 0 1040 484" role="img" aria-labelledby="title desc"><title id="title">A waiting migration can block the next reader</title><desc id="desc">A long-running transaction holds a read lock on a view. A migration asks for an exclusive lock; another reader arrives afterward. Without the guard: Migration waits for the exclusive lock. The later reader queues behind the migration. The reader stays blocked while the migration waits. With the guard: Limit each migration lock wait to 500 ms. On timeout, abort the migration attempt. The reader proceeds; the migration retries later.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#63758a"/></marker></defs><rect width="1040" height="484" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="44" font-size="25" fill="#14243a" font-weight="700">A waiting migration can block the next reader</text><text x="28" y="82" font-size="18" fill="#243247" font-weight="400">A long-running transaction holds a read lock on a view.</text><text x="28" y="110" font-size="18" fill="#243247" font-weight="400">A migration asks for an exclusive lock; another reader arrives afterward.</text><text x="28" y="163" font-size="12" fill="#a23d29" font-weight="700">WITHOUT THE GUARD</text><rect x="28" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="44" y="210" font-size="18" fill="#243247" font-weight="400">Migration waits for</text><text x="44" y="236" font-size="18" fill="#243247" font-weight="400">the exclusive lock.</text><path d="M339 218H359" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="366" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="382" y="210" font-size="18" fill="#243247" font-weight="400">The later reader queues</text><text x="382" y="236" font-size="18" fill="#243247" font-weight="400">behind the migration.</text><path d="M677 218H697" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="720" y="210" font-size="18" fill="#243247" font-weight="400">The reader stays blocked</text><text x="720" y="236" font-size="18" fill="#243247" font-weight="400">while the migration waits.</text><text x="28" y="305" font-size="12" fill="#12675b" font-weight="700">WITH THE GUARD</text><rect x="28" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="44" y="352" font-size="18" fill="#243247" font-weight="400">Limit each migration</text><text x="44" y="378" font-size="18" fill="#243247" font-weight="400">lock wait to 500 ms.</text><path d="M339 360H359" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="366" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="382" y="352" font-size="18" fill="#243247" font-weight="400">On timeout, abort</text><text x="382" y="378" font-size="18" fill="#243247" font-weight="400">the migration attempt.</text><path d="M677 360H697" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="720" y="352" font-size="18" fill="#243247" font-weight="400">The reader proceeds;</text><text x="720" y="378" font-size="18" fill="#243247" font-weight="400">the migration retries later.</text><text x="28" y="458" font-size="16" fill="#52647c" font-weight="400">The existing read lock is compatible with the later reader. The queued migration is the obstacle.</text></g></svg>
