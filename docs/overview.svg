<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#466a7a" stroke-width="1.5"/></marker></defs><rect width="1100" height="1030" rx="18" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b4b}.title{font-size:32px;font-weight:bold}.sub{font-size:19px;fill:#526b77}.head{font-size:22px;font-weight:bold}.body{font-size:20px}.small{font-size:17px;fill:#526b77}</style><text x="36" y="49" class="title">Build automation that completes useful work</text><text x="36" y="83" class="sub">Conceptual building blocks demonstrated in separate examples</text><rect x="35" y="140" width="280" height="176" rx="10" fill="#f4f8fa" stroke="#b3c8d0"/><text x="53" y="174" class="head">Incoming work</text><text x="53" y="206" class="body">Questions and requests</text><text x="53" y="234" class="body">Ticket and data events</text><text x="53" y="262" class="body">Scheduled jobs</text><rect x="410" y="140" width="280" height="176" rx="10" fill="#e7eff9" stroke="#b3c8d0"/><text x="428" y="174" class="head">Application workflow</text><text x="428" y="206" class="body">Select and claim work</text><text x="428" y="234" class="body">Coordinate the next step</text><text x="428" y="262" class="body">Apply task-specific rules</text><rect x="785" y="140" width="280" height="176" rx="10" fill="#e7f3ec" stroke="#b3c8d0"/><text x="803" y="174" class="head">Useful outcomes</text><text x="803" y="206" class="body">Answers and staff notes</text><text x="803" y="234" class="body">Approved record changes</text><text x="803" y="262" class="body">Processed data updates</text><path d="M320 225 H400" fill="none" stroke="#466a7a" stroke-width="2" marker-end="url(#a)" /><path d="M695 225 H775" fill="none" stroke="#466a7a" stroke-width="2" marker-end="url(#a)" /><text x="360" y="204" text-anchor="middle" class="small">start</text><text x="738" y="204" text-anchor="middle" class="small">complete</text><text x="36" y="373" class="head">Choose task-specific building blocks</text><rect x="35" y="465" width="310" height="176" rx="10" fill="#f4f8fa" stroke="#b3c8d0"/><text x="53" y="499" class="head">Remember progress</text><text x="53" y="531" class="body">Claims and event IDs</text><text x="53" y="559" class="body">Proposals and approvals</text><text x="53" y="587" class="body">Results from earlier steps</text><rect x="395" y="465" width="310" height="176" rx="10" fill="#eef0fa" stroke="#b3c8d0"/><text x="413" y="499" class="head">Use models where helpful</text><text x="413" y="531" class="body">Interpret a request</text><text x="413" y="559" class="body">Choose a tool or past case</text><text x="413" y="587" class="body">Draft or assess an answer</text><rect x="755" y="465" width="310" height="176" rx="10" fill="#f4f8fa" stroke="#b3c8d0"/><text x="773" y="499" class="head">Execute through code</text><text x="773" y="531" class="body">Parameterized queries</text><text x="773" y="559" class="body">Defined tools and clients</text><text x="773" y="587" class="body">Transactional updates</text><path d="M460 323 V405 H190 V456" fill="none" stroke="#466a7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><path d="M550 323 V456" fill="none" stroke="#466a7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><path d="M640 323 V405 H910 V456" fill="none" stroke="#466a7a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="254" y="442" text-anchor="middle" class="small">store / load</text><text x="640" y="442" text-anchor="middle" class="small">request / response</text><text x="987" y="442" text-anchor="middle" class="small">call / result</text><rect x="20" y="684" width="1060" height="319" rx="12" fill="#f4f7f8"/><text x="38" y="721" class="head">Keep the automation observable and operable as it changes</text><text x="38" y="751" class="sub">Separate operational examples inspect work, deployments and reporting results.</text><rect x="38" y="782" width="319" height="195" rx="10" fill="white" stroke="#b3c8d0"/><text x="56" y="816" class="head">Inspect work</text><text x="56" y="848" class="body">Record action outcomes</text><text x="56" y="876" class="body">Track each job’s runs</text><text x="56" y="904" class="body">Pause jobs independently</text><rect x="390" y="782" width="319" height="195" rx="10" fill="white" stroke="#b3c8d0"/><text x="408" y="816" class="head">Check deployed behavior</text><text x="408" y="848" class="body">Compare live definitions</text><text x="408" y="876" class="body">with expected definitions</text><text x="408" y="904" class="body">Bound migration lock waits</text><rect x="742" y="782" width="319" height="195" rx="10" fill="white" stroke="#b3c8d0"/><text x="760" y="816" class="head">Explain differing results</text><text x="760" y="848" class="body">Apply named business rules</text><text x="760" y="876" class="body">Compare ledger and workbook</text><text x="760" y="904" class="body">Trace remaining records</text></svg>